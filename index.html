try{s.textContent="Saving photo…";if(assets){const r=await assets.upload(f);JF.att.push({u:r.url,n:f.name,id:r.id})}s.textContent="Claude is reading the checklist photo…";
const r=await smp.json(`This is a photo of a filled paper weekly maintenance checklist for the machine "${JF.eq}". The tasks are:\n${c.tasks.map((t,i)=>(i+1)+". "+t).join("\n")}\nFor each task look at the ticks or marks in the most recently filled week column. Answer "OK" if ticked or done, "Not OK" if marked as a problem or crossed, "NA" if blank or not applicable. Also copy any handwritten remarks. Return ONLY JSON: {"results":["OK", ... one per task in the same order],"remarks":"..."}`,{images:[f],cache:false});
(r.results||[]).forEach((v,i)=>{if(["OK","Not OK","NA"].includes(v)&&i<c.tasks.length)JF.ck[i]=v});if(r.remarks)JF.desc=(JF.desc?JF.desc+"\n":"")+r.remarks;JF.msg="Claude filled the checklist from the photo. Please check the ticks before submitting.";render()}catch(x){s.textContent="Could not read the photo: "+(x.message||x.code||x)}}

async function jfSave2(){jfSync();const f=JF,c=ckOf();if(!f.eq)return jfErr("Please enter the machine name.");const d=f.date||today(),loc=locOf(f.eq),bk=f.type=="Breakdown";

if(c){const v=c.tasks.map((t,i)=>f.ck[i]||"OK"),bad=c.tasks.filter((t,i)=>v[i]=="Not OK");desc=c.tasks.map((t,i)=>v[i]!="NA"?(i+1)+". "+t+(v[i]=="Not OK"?" - NOT OK":""):"").filter(Boolean).join("\n")+(desc?"\n"+desc:"");

for(const q of sp){const it=invItem(q.part);D.spares.push({id:uid(),date:d,equipment:f.eq,code:"",part:q.part,qty:q.qty,uom:q.uom||"Nos",location:loc,rate:it?it.price:"",remark:"Job entry",att:[],st:1,job:wid});if(it)await adj(it,-q.qty,1)}
await Promise.all([sv("work"),svc?sv("service"):0,sp.length?sv("spares"):0,sp.length?sv("inventory"):0,bk?sv("breakdowns"):0]);
R.tech=f.tech;scrollTo(0,0);JF={ck:{},sp:[{}],att:[],type:f.type,tech:f.tech,err:"",msg:"Saved. The job is now in the Work log"+(sp.length?", Spares and Stock":"")+(bk?", Breakdown log":"")+" and will appear in the Daily and Weekly reports."};render()}

function lifeRows(){const t=today();return D.lifespec.map(s=>{const ds=[...new Set(D.spares.filter(r=>sameP(r.part,s.part)&&(!s.equipment||r.equipment==s.equipment)).map(r=>r.date))].sort(),gaps=ds.slice(1).map((d,i)=>dd_(ds[i],d)),avg=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):0,last=ds[ds.length-1]||"",age=last?dd_(last,t):null,oem=Math.round(oemDays(s));
const st=!oem?"Set OEM life":age==null?"No replacement recorded":age>oem?"Past OEM life":age>oem*.8?"Replace soon":"OK";return{s,n:ds.length,last,age,avg,oem,gaps,st,ach:avg&&oem?Math.round(avg/oem*100):null,left:oem&&age!=null?oem-age:null}})}
function lifeScr(){const rows=lifeRows(),cov=D.lifespec,seen={};D.spares.forEach(r=>{const k=r.equipment+"|"+NK(r.part);(seen[k]=seen[k]||{eq:r.equipment,p:r.part,d:new Set}).d.add(r.date)});
const auto=Object.values(seen).filter(x=>x.d.size>=2&&!cov.some(s=>sameP(x.p,s.part)&&(!s.equipment||s.equipment==x.eq))).map(x=>{const ds=[...x.d].sort(),g=ds.slice(1).map((d,i)=>dd_(ds[i],d));return{...x,n:ds.length,avg:Math.round(g.reduce((a,b)=>a+b,0)/g.length),last:ds[ds.length-1]}}).sort((a,b)=>b.n-a.n).slice(0,25);
return `<p class="sub">Actual life is the number of days between replacements of the same part on the same machine, taken from your Spares records. Use Add OEM life to enter the vendor or OEM life of a part, and the app compares it with the actual life.</p><div class="tbar np"><div class="ta"><button class="p" onclick="specModal()">+ Add OEM life</button></div></div>
<div class="card w"><b>OEM life against actual life</b>${rows.length?`<table><tr><th>Machine</th><th>Part</th><th>OEM / vendor life</th><th>Replacements</th><th>Last replaced</th><th>Current age (days)</th><th>Average actual life (days)</th><th>Achieved vs OEM</th><th>Days left</th><th>Status</th><th class="np"></th></tr>${rows.map(x=>`<tr><td>${e(x.s.equipment||"Any")}</td><td>${e(x.s.part)}</td><td>${x.s.oem?x.s.oem+" "+x.s.unit.toLowerCase()+" ("+x.oem+" days)":""}</td><td>${x.n}</td><td>${x.last?fd(x.last):""}</td><td>${x.age??""}</td><td>${x.avg||""}</td><td class="${x.ach&&x.ach<70?"bad":""}">${x.ach!=null?x.ach+"%":""}</td><td>${x.left??""}</td><td class="${x.st=="Past OEM life"?"bad":x.st=="Replace soon"?"warn":x.st=="OK"?"ok":"m"}">${x.st}</td><td class="np"><button onclick="specModal('${x.s.id}')">Edit</button></td></tr>`).join("")}</table>`:`<p class="m">No OEM life entered yet. Use the button above to add parts and their OEM life.</p>`}</div>

function fcScr(){const rows=fcRows().slice(0,150);return `<p class="sub">Average monthly use comes from your Spares records. Suggested minimum = average monthly use × cover months. Link a spare name to a stock item by filling "Spare-entry name" on the stock item.</p><div class="fbar np"><label class="inl">Months of history<input type="number" min="1" max="24" value="${R.fm||12}" style="width:70px" onchange="R.fm=this.value;render()"></label><label class="inl">Cover months<input type="number" min="1" max="12" value="${R.fc||2}" style="width:70px" onchange="R.fc=this.value;render()"></label><button class="p" onclick="applyMins()">Apply suggested minimum to all linked items</button></div>

const cn=n=>{let s="";while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s};
const nz=s=>String(s||"").toLowerCase().replace(/\(all\)/g,"").replace(/[^a-z0-9]/g,"");
function pmIdx2(){const m={},add=(k,d)=>{k=nz(k);(m[k]=m[k]||[]).push(d)};D.work.forEach(r=>{if(!/weekly/i.test(r.type))return;if(nz(r.equipment)=="shuttle")add(dow(r.date)>=4||dow(r.date)==0?"Shuttle (HCS)":"Shuttle (Pod line)",r.date);else add(r.equipment,r.date)});D.service.forEach(r=>add(r.equipment,r.date));return m}

kpiHtml([{l:"Breakdowns"+(rows.length!=all?" (of "+all+")":""),v:rows.length,bad:rows.length},{l:"Total downtime",v:rnd1(hrs)+" h"},{l:"Average repair time",v:rnd1(rows.length?hrs/rows.length:0)+" h"},{l:"Longest breakdown",v:big?rnd1(N(big.hours))+" h":"-"},{l:"Most affected machine",v:mcs[0]?mcs[0][0]+" ("+mcs[0][1]+")":"-"}],[])+(window.Chart?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px">`+cd("bd1","Breakdowns by machine")+cd("bd2","By month: breakdowns and downtime")+cd("bd3","By location")+`</div>`:"")+`</div>`}
let AN={mach:""},ANCH=[];
function anSet(v){AN.mach=AN.mach===v?"":v;render()}
function anPanel(c){const A=c.mach,tb=A.reduce((x,m)=>x+m.bd,0),th=A.reduce((x,m)=>x+m.h,0),avg=A.length?A.reduce((x,m)=>x+m.av,0)/A.length:100,cost=A.reduce((x,m)=>x+m.sc,0);
const cd=(id,t)=>`<div class="card" style="margin:0"><b style="font-size:13px">${t}</b><div style="position:relative;height:220px;margin-top:6px"><canvas id="${id}"></canvas></div></div>`;
return `<div class="card np" style="margin:10px 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Analysis overview</b><span class="m">touch a bar or slice to show only that machine in the table below</span>${AN.mach?`<span class="m">· Showing: ${e(AN.mach)}</span><button onclick="anSet(AN.mach)">Clear</button>`:""}</div>`+kpiHtml([{l:"Breakdowns",v:tb,bad:tb},{l:"Total downtime",v:rnd1(th)+" h"},{l:"Average availability",v:rnd1(avg)+"%"},{l:"Spare cost",v:inrP(cost)}],[])+(window.Chart?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px">`+cd("an1","Availability % (lowest first)")+cd("an2","Downtime hours by machine")+cd("an3","Spare cost by machine (₹)")+cd("an4","PM status of machines")+`</div>`:"")+`</div>`}
function anInit(){if(!window.Chart)return;ANCH.forEach(c=>{try{c.destroy()}catch(x){}});ANCH=[];Chart.defaults.font.size=12;const c=calc(),A=c.mach,PAL=["#70AD47","#2E75B6","#ED7D31","#7E57C2","#12A8B0","#F2C200","#E8407F","#8A8F98"],base={responsive:true,maintainAspectRatio:false},mk=(id,cfg)=>{const el=document.getElementById(id);if(!el)return;if(cfg.empty){el.parentNode.innerHTML='<p class="m" style="padding:30px 0;text-align:center">No data in this range.</p>';return}try{ANCH.push(new Chart(el,cfg))}catch(x){}},hl=(L,on,off)=>L.map(l=>AN.mach&&l!=AN.mach?off:on);
const a1=[...A].sort((x,y)=>x.av-y.av).slice(0,10),l1=a1.map(x=>x.n),mn=Math.max(0,Math.floor(Math.min(100,...a1.map(x=>x.av))-3));
mk("an1",{empty:!a1.length,type:"bar",data:{labels:l1,datasets:[{label:"Availability %",data:a1.map(x=>rnd1(x.av)),backgroundColor:hl(l1,"rgba(46,184,74,.9)","rgba(46,184,74,.28)"),borderRadius:4}]},options:{...base,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{min:mn,max:100}},onClick:(ev,el)=>{if(el.length)anSet(l1[el[0].index])}}});
const a2=[...A].filter(x=>x.h>0).sort((x,y)=>y.h-x.h).slice(0,10),l2=a2.map(x=>x.n);
mk("an2",{empty:!a2.length,type:"bar",data:{labels:l2,datasets:[{label:"Downtime (hrs)",data:a2.map(x=>rnd1(x.h)),backgroundColor:hl(l2,"rgba(229,76,76,.9)","rgba(229,76,76,.28)"),borderRadius:4}]},options:{...base,indexAxis:"y",plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:i=>a2[i.dataIndex].bd+" breakdown(s)"}}},onClick:(ev,el)=>{if(el.length)anSet(l2[el[0].index])}}});
const a3=[...A].filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc).slice(0,8),l3=a3.map(x=>x.n);
mk("an3",{empty:!a3.length,type:"doughnut",data:{labels:l3,datasets:[{data:a3.map(x=>Math.round(x.sc)),backgroundColor:l3.map((l,i)=>AN.mach&&l!=AN.mach?"#d5d9df":PAL[i%8]),borderColor:"#fff",borderWidth:2,hoverOffset:10}]},options:{...base,cutout:"55%",plugins:{legend:{position:"right"},tooltip:{callbacks:{label:i=>i.label+": ₹"+i.parsed.toLocaleString("en-IN")}}},onClick:(ev,el)=>{if(el.length)anSet(l3[el[0].index])}}});
const st={};A.forEach(x=>{const k=/^overdue/i.test(x.st)?"Overdue":String(x.st||"-");st[k]=(st[k]||0)+1});const l4=Object.keys(st),col4={OK:"#2eb84a",Overdue:"#e5484d","Not in use":"#8a8f98","No record":"#f2c200"};
mk("an4",{empty:!l4.length,type:"doughnut",data:{labels:l4,datasets:[{data:l4.map(k=>st[k]),backgroundColor:l4.map((k,i)=>col4[k]||PAL[i%8]),borderColor:"#fff",borderWidth:2}]},options:{...base,cutout:"55%",plugins:{legend:{position:"right"}}}})}

/* ===== equipment cards with machine photos (added) ===== */
const eqInit=n=>String(n||"?").split(/[\s\-_/()]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function eqGallery(rows){const cols=["#2f80d8","#2eb84a","#f08a24","#7e57c2","#12a8b0","#e8407f"];
const card=(r,i)=>{const im=(r.att||[]).find(isImgN),ps=pstat(r.name||""),nb=D.breakdowns.filter(b=>b.equipment==r.name).length,st=r.status||"-",stc=st=="Running"?"ok":st=="Under maintenance"?"warn":st=="Idle"?"idle":"off",c=cols[i%6];
return `<div class="eqc"><div class="eqp" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 50%,#0f2a43))">${im?`<a href="${e(im.u)}" target="_blank" rel="noopener"><img loading="lazy" src="${e(im.u)}" alt="${e(r.name||"")}"></a>`:`<div class="eqph">${e(eqInit(r.name))}</div>`}<span class="eqs ${stc}">${e(st)}</span></div><div class="eqb"><div class="eqn">${e(r.name||"")}</div><div class="m">${e([r.code,r.model].filter(Boolean).join(" · ")||"\u00a0")}</div><div class="m">${e(r.location||"\u00a0")}</div><div class="eqm"><span>PM: <b class="${ps[1]=="ok"?"ok":ps[1]=="bad"?"bad":""}">${e(ps[0])}</b></span><span>Breakdowns: <b>${nb}</b></span></div><div class="eqa np"><button onclick="eqPhoto('${r.id}')">${im?"Change photo":"Add photo"}</button>${im?`<button class="d" onclick="eqPhotoDel('${r.id}')">Remove</button>`:""}<button onclick="rowEdit('equipment','${r.id}')">Edit</button></div></div></div>`};
return `<div class="eqg">${rows.map(card).join("")||'<p class="m">No machines found.</p>'}</div>`}
function eqPhoto(id){attPick(async a=>{const r=attRec("equipment",id),att=r.att||[],i=att.findIndex(isImgN);r.att=i>=0?att.map((x,j)=>j==i?a:x):[a,...att];await sv("equipment");render();toast("Machine photo saved")})}
async function eqPhotoDel(id){if(!confirm("Remove this machine photo?"))return;const r=attRec("equipment",id),att=r.att||[],i=att.findIndex(isImgN);if(i>=0){r.att=att.filter((x,j)=>j!=i);await sv("equipment");render()}}

/* ===== KPIs, availability, remarks, photos (added) ===== */
const rnd1=x=>Math.round(x*10)/10;
function availOf(rows,days){const by={};rows.forEach(r=>{const k=r.equipment||"-";by[k]=(by[k]||0)+N(r.hours)});const hrs=Object.values(by).reduce((x,y)=>x+y,0);return{hrs:rnd1(hrs),pct:Math.max(0,rnd1(100-100*hrs/(24*days))),n:rows.length,names:Object.entries(by).map(([k,v])=>k+" "+(v?rnd1(v)+" h":"hours not entered"))}}
const availTxt=a=>a.n?a.pct+"% ("+a.names.join(", ")+")":"100% (no breakdown)";
const isPMw=w=>!!w&&/daily|weekly/i.test(w.type||"")&&!/planned|corrective/i.test(w.type||"");
const jobOfSpare=r=>r.job?D.work.find(w=>w.id==r.job):D.work.find(w=>w.date==r.date&&(nz(w.equipment)==nz(r.equipment)||grpSet(w.equipment).has(nz(r.equipment))));
function dayKpi(d){const x=dayData(d),ix=pmIdx2(),hol=holName(d),sch=hol?[]:D.tlrows.filter(r=>r.pmday==WD[dow(d)]),isDone=r=>rowDates(r,ix).includes(d),done=sch.filter(isDone),pend=sch.filter(r=>!isDone(r)),av=availOf(x.b,1),
pmSp=x.s.filter(r=>isPMw(jobOfSpare(r))).map(r=>r.part+" - "+r.qty+" "+(r.uom||"Nos")+" ("+r.equipment+")"),
nDaily=x.w.filter(r=>/daily/i.test(r.type)).length,nPlan=x.w.filter(r=>/planned/i.test(r.type)).length;
const items=[{l:"Weekly PM done today",v:done.length+" of "+sch.length,c:sch.length&&done.length<sch.length?AM:DG,bad:sch.length&&done.length<sch.length},{l:"Daily activities",v:nDaily},{l:"Planned maintenance",v:nPlan},{l:"Breakdowns",v:x.b.length+(av.hrs?" ("+av.hrs+" h)":""),c:x.b.length?RD:DG,bad:x.b.length}];
const lines=[["Machine availability:",availTxt(av)],["Spares consumed during PM:",pmSp.join("; ")||"None"]];if(pend.length)lines.push(["PM still pending today:",pend.map(r=>r.name).join(", ")]);if(hol)lines.unshift(["Note:",hol+" - no weekly PM scheduled"]);
return{items,lines}}
const kpiHtml=(items,lines)=>`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${items.map(k=>`<div class="kpi" style="cursor:default;min-height:78px"><div class="kl">${e(k.l)}</div><div class="kv ${k.bad?"bad":""}" style="font-size:21px">${e(k.v)}</div></div>`).join("")}</div>${lines.map(l=>`<p style="margin:3px 0"><b>${e(l[0])}</b> ${e(l[1])}</p>`).join("")}`;
const kpiRows=k=>k.items.map(i=>[i.l,String(i.v)]).concat(k.lines.map(l=>[l[0].replace(/:$/,""),String(l[1])]));
function pdfKpiBlock(doc,y,items,lines){const g=3,w=(190-g*(items.length-1))/items.length;items.forEach((k,i)=>{const x=10+i*(w+g);doc.setFillColor(...LGR);doc.setDrawColor(205,214,198);doc.roundedRect(x,y,w,15,1.5,1.5,"FD");doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(...MT);doc.text(k.l,x+2.5,y+5);doc.setFont("helvetica","bold").setFontSize(13).setTextColor(...(k.c||DG));doc.text(String(k.v),x+2.5,y+12)});y+=20;
lines.forEach(l=>{doc.setFontSize(8.5);doc.setFont("helvetica","bold").setTextColor(...TX);const lab=l[0]+" ";doc.text(lab,10,y);const lw=doc.getTextWidth(lab);doc.setFont("helvetica","normal");doc.splitTextToSize(String(l[1]),190-lw).forEach(t=>{doc.text(t,10+lw,y);y+=4})});return y+2}
function descParts(desc){const L=String(desc||"").split("\n").map(t=>t.trim()).filter(Boolean);let last=-1;L.forEach((l,i)=>{if(/^\d{1,2}[.)]\s*/.test(l))last=i});return L.map((l,i)=>{const rem=last>=0&&i>last&&!/^(spares used|problem|root cause)\s*:/i.test(l);return{b:rem,t:rem?(/^remarks?\s*:/i.test(l)?l:"Remark: "+l):perfect(l)}})}
const descHtml=d=>descParts(d).map(p=>p.b?"<b>"+e(p.t)+"</b>":e(p.t)).join("<br>");
function weekKpi(a,b){const st=wkStats(a,b),pr=D.production.filter(r=>r.date>=a&&r.date<=b),av=availOf(st.bd,7),hcs=sm(pr,"hcs"),pod=sm(pr,"pod"),circ=sm(pr,"circ");return{st,pr,av,hcs,pod,circ,prod:rnd1(hcs+pod+circ),cost:st.sp.reduce((x,r)=>x+spVal(r),0)}}
const weekProdChart=(a,pr)=>{const days=[...Array(7)].map((_,i)=>addD(a,i)),v=k=>days.map(d=>N((pr.find(p=>p.date==d)||{})[k]));return chartPNG({line:1,unit:"m³",title:"Production in the week (m³)",labels:days.map(d=>WD[dow(d)].slice(0,3)+" "+d.slice(8)),series:[{name:"HCS",values:v("hcs"),color:"#70AD47"},{name:"POD",values:v("pod"),color:"#2E75B6"},{name:"Circulation",values:v("circ"),color:"#ED7D31"}],w:900,h:340})};
const KGW=[2192,2192,2192,2192,2192];
async function sitePhotos2(rows,max){const t0=Date.now(),list=rows.filter(r=>(r.att||[]).some(isImg)),cand=[];for(let k=0;k<3;k++)for(const r of list){const a=(r.att||[]).filter(isImg)[k];if(a)cand.push({r,a})}
const out=[];let i=0;while(out.length<max&&i<cand.length&&Date.now()-t0<90000){const need=max-out.length,batch=cand.slice(i,i+need);i+=need;const got=await Promise.all(batch.map(c=>imgData(c.a)));got.forEach((im,j)=>{if(im)out.push({cap:fd(batch[j].r.date)+" - "+batch[j].r.equipment+(batch[j].r.type?" ("+batch[j].r.type+")":""),im})})}return out}
function mMajor(d,cu,pc){const o=[],pd=d.pr.filter(r=>N(r.hcs)+N(r.pod)+N(r.circ)>0),tv=r=>N(r.hcs)+N(r.pod)+N(r.circ);
if(pd.length){const best=pd.slice().sort((x,y)=>tv(y)-tv(x))[0];o.push("Production: "+rnd1(d.hcs+d.pod+d.circ)+" m³ (HCS "+rnd1(d.hcs)+", POD "+rnd1(d.pod)+", Circulation "+rnd1(d.circ)+") and "+d.beds+" beds in "+pd.length+" production days. Best day "+fd(best.date)+" with "+rnd1(tv(best))+" m³.")}else o.push("Production: no production recorded for this month.");
o.push("Preventive maintenance: weekly PM achieved "+pc+"% ("+d.tl.comp+" of "+d.tl.sched+" done).");
if(d.bd.length){const w=d.bd.slice().sort((x,y)=>N(y.hours)-N(x.hours))[0];o.push("Breakdowns: "+d.bd.length+" in the month, total downtime "+rnd1(d.down)+" hrs. Longest: "+w.equipment+(w.problem?" - "+w.problem:"")+" ("+N(w.hours)+" hrs).")}else o.push("Breakdowns: none recorded this month.");
const cm=agg(d.sp,r=>r.equipment,r=>spVal(r)).filter(x=>x[1]>0);o.push("Spares: consumed cost "+inrP(d.cost)+(cm.length?"; highest on "+cm[0][0]+" ("+inrP(cm[0][1])+")":"")+".");
if(cu)o.push("Spare parts value: opening "+(cu.open!=null?inrP(cu.open):"-")+", procured "+inrP(cu.recv)+", consumed "+inrP(cu.cons)+", closing "+inrP(cu.close)+".");
const ov=D.periodic.map(r=>({r,...pdue(r)})).filter(x=>x.cls=="bad");if(ov.length)o.push(ov.length+" periodic task(s) overdue, for example "+ov.slice(0,3).map(x=>x.r.equipment+" - "+x.r.task).join("; ")+".");return o}

/* ===== every report: visible progress + clear error message (added) ===== */
["dxl","dpdf","wdocx","wpdf","xprod","xspare","xbd","xreq","xtl","xstock","msumPdf","bdPdf","bdXl"].forEach(n=>{const f=window[n];if(typeof f!=="function")return;window[n]=async function(...a){const t0=Date.now(),iv=setInterval(()=>toast("Still preparing the report… "+Math.round((Date.now()-t0)/1000)+" seconds"),4000);
try{await f.apply(this,a)}catch(err){console.error(n,err);alert("The report could not be created.\n\nReason: "+(err&&err.message||err)+"\n(report: "+n+")\n\nPlease send this message to your app helper.")}finally{clearInterval(iv)}}});
